<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Loading... | Tora's Portfolio</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 動的背景 -->
  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>

  <main class="app-wrapper">
    <!-- メインカード（グラスモフィズム） -->
    <div class="glass-card main-profile">
      
      <!-- アバターセクション -->
      <div class="avatar-container">
        <div class="avatar-glow"></div>
        <img src="assets/avatar.png" alt="Avatar" class="avatar-image">
      </div>

      <!-- スプレッドシート連動テキスト -->
      <div class="profile-texts">
        <h1 id="profile-name" class="skeleton-text">Name</h1>
        <h2 id="profile-catchphrase" class="skeleton-text skeleton-sub">Catchphrase</h2>
        <div id="profile-bio" class="bio-text skeleton-block">Bio loading...</div>
      </div>

      <!-- スプレッドシート連動：メインアクションボタン -->
      <a id="link-x" href="#" target="_blank" rel="noopener noreferrer" class="neon-btn hidden">
        <i data-lucide="twitter"></i>
        <span>Follow on X</span>
      </a>
      
      <div class="divider"></div>

      <!-- 1. Live Player Section -->
      <section class="portal-section live-player">
        <h3 class="section-title"><i data-lucide="radio"></i> LIVE NOW / LATEST</h3>
        <div class="video-container">
          <div class="video-placeholder">
            <i data-lucide="play-circle" class="play-icon"></i>
            <span>Loading Stream...</span>
          </div>
        </div>
      </section>

      <!-- 2. Interactive Schedule -->
      <section class="portal-section interactive-schedule">
        <h3 class="section-title"><i data-lucide="calendar"></i> WEEKLY SCHEDULE</h3>
        <div class="schedule-grid" id="scheduleGrid">
          <!-- JSで動的にハイライト生成 -->
        </div>
      </section>

      <!-- 3. Repertoire & 1-Tap Request -->
      <section class="portal-section repertoire-request">
        <h3 class="section-title"><i data-lucide="music"></i> SONG REPERTOIRE</h3>
        <div class="search-box">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="songSearch" placeholder="曲名やアーティストで検索...">
        </div>
        <div class="song-list" id="songList">
          <!-- JSで動的生成 -->
        </div>
      </section>

      <!-- 4. Merch & Goods Showcase -->
      <section class="portal-section merch-showcase">
        <h3 class="section-title"><i data-lucide="shopping-bag"></i> OFFICIAL GOODS</h3>
        <div class="merch-carousel" id="merchCarousel">
          <!-- JSで動的生成 -->
        </div>
      </section>

      <!-- 5. Integrated Contact Box -->
      <section class="portal-section contact-box">
        <h3 class="section-title"><i data-lucide="mail"></i> お便り・マシュマロ</h3>
        <div class="form-container">
          <textarea placeholder="匿名でメッセージやリクエストを送れます" rows="3"></textarea>
          <button class="submit-btn"><i data-lucide="send"></i> 送信</button>
        </div>
      </section>

    </div>
    
    <footer class="app-footer">
      <p>&copy; 2026 Tora. Powered by Custom GitHub Pages.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
